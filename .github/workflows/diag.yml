name: Receipt-reading diagnostics

# Runs the receipt tests repeatedly on Windows to find and measure an intermittent stall.
# Only runs on the "diag" branch, never on main.
on:
  push:
    branches: [diag]
  workflow_dispatch:

jobs:
  windows-receipts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx cross-env GABLE_E2E=1 VITE_SHOWCASE=1 electron-forge package
      - run: npx playwright test tests/e2e/receipts.spec.ts --repeat-each=5 --workers=1 --reporter=list,github
        continue-on-error: true
      - if: always()
        run: node scripts/ci-print-logs.mjs
